<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Elegant Login Page - Flowing Pattern</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#1754cf",
              "background-light": "#f6f6f8",
              "background-dark": "#111621",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-white selection:bg-primary selection:text-white">
<!-- Main Container -->
<div class="relative flex min-h-screen w-full flex-col overflow-hidden">
<!-- Background Simulation (Static Gradient Mesh) -->
<!-- This simulates the flowing abstract pattern using large, blurred gradients -->
<div class="absolute inset-0 z-0 bg-[#111722]">
<div class="absolute top-[-10%] left-[-10%] h-[70vh] w-[70vw] rounded-full bg-[#1754cf] opacity-20 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] h-[70vh] w-[70vw] rounded-full bg-[#1754cf] opacity-10 blur-[120px]"></div>
<div class="absolute left-[30%] top-[40%] h-[50vh] w-[50vw] rounded-full bg-indigo-900 opacity-20 blur-[100px]"></div>
<!-- Subtle Overlay Texture for depth -->
<div class="absolute inset-0 bg-[url('https://placeholder.pics/svg/300')] bg-repeat opacity-[0.03] mix-blend-overlay" data-alt="subtle noise texture overlay"></div>
</div>
<!-- Layout Content -->
<div class="relative z-10 flex flex-1 flex-col items-center justify-center p-4 sm:p-8">
<!-- Glassmorphism Card -->
<div class="w-full max-w-[480px] overflow-hidden rounded-2xl border border-white/10 bg-[#1a2232]/60 shadow-[0_8px_32px_0_rgba(0,0,0,0.36)] backdrop-blur-xl">
<!-- Card Header -->
<div class="flex flex-col items-center px-8 pt-10 pb-6 text-center">
<div class="mb-6 flex h-14 w-14 items-center justify-center rounded-xl bg-primary/20 shadow-inner ring-1 ring-white/10">
<span class="material-symbols-outlined text-[28px] text-white">fingerprint</span>
</div>
<h1 class="text-3xl font-bold tracking-tight text-white mb-2">Welcome Back</h1>
<p class="text-base font-normal text-[#93a5c8]">Please enter your details to sign in.</p>
</div>
<!-- Card Body / Form -->
<div class="flex flex-col gap-5 px-8 pb-10">
<!-- Email Field -->
<label class="flex flex-col gap-2">
<span class="text-sm font-medium leading-none text-white">Email Address</span>
<div class="relative flex items-center">
<input class="peer w-full rounded-lg border border-[#344465] bg-[#111722]/50 px-4 py-3.5 text-base text-white placeholder-[#93a5c8] focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary" placeholder="name@company.com" type="email"/>
<div class="pointer-events-none absolute right-4 text-[#93a5c8] peer-focus:text-primary">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
</div>
</label>
<!-- Password Field -->
<label class="flex flex-col gap-2">
<div class="flex items-center justify-between">
<span class="text-sm font-medium leading-none text-white">Password</span>
<a class="text-sm font-medium text-primary hover:text-[#4d82f3] transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<input class="peer w-full rounded-lg border border-[#344465] bg-[#111722]/50 px-4 py-3.5 text-base text-white placeholder-[#93a5c8] focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary" placeholder="Enter your password" type="password"/>
<div class="cursor-pointer absolute right-4 text-[#93a5c8] hover:text-white peer-focus:text-primary">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</div>
</div>
</label>
<!-- Sign In Button -->
<button class="mt-2 flex w-full items-center justify-center rounded-lg bg-primary py-3.5 text-base font-bold text-white shadow-lg shadow-primary/25 transition-all hover:bg-blue-600 hover:shadow-primary/40 active:scale-[0.98]">
                        Sign In
                    </button>
<!-- Sign Up Link -->
<div class="mt-2 text-center text-sm text-[#93a5c8]">
                        Don't have an account? 
                        <a class="font-semibold text-white hover:underline hover:text-primary transition-colors" href="#">Sign up</a>
</div>
</div>
</div>
<!-- Footer Copyright (Optional aesthetic touch) -->
<div class="mt-8 text-xs text-white/20">
                © 2023 Elegant Inc. Secure Login.
            </div>
</div>
</div>
</body></html>
